<h2>Cadastrar Jogo</h2>

<form (ngSubmit)="cadastrar()">
  <p>
    Nome: <input type="text" name="nome" [(ngModel)]="nome" />
    @if (erroNome != '') {
      <span style="color: red">{{ erroNome }}</span>
    }
  </p>
  <p>Descrição: <input type="text" name="descricao" [(ngModel)]="descricao" /></p>
  <p>
    Categoria:
    <select name="categoria" [(ngModel)]="categoria">
      <option value="">Selecione...</option>
      @for (c of categorias; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </p>
  <p>
    Preço: <input type="number" name="preco" [(ngModel)]="preco" />
    @if (erroPreco != '') {
      <span style="color: red">{{ erroPreco }}</span>
    }
  </p>
  <button type="submit">Cadastrar</button>
</form>

@if (sucesso != '') {
  <p style="color: lightgreen">{{ sucesso }}</p>
}
